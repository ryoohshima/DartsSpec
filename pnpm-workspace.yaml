allowBuilds:
  esbuild: true
  sharp: true
  workerd: true

minimumReleaseAge: 10080
trustPolicy: no-downgrade
# semver@6.3.1 (babel devDependency) predates npm provenance adoption for this
# package (provenance started at semver@7.6.0, 2024-02); registry signature and
# tarball hash are unchanged since 2023-07-10. Verified safe, excluded to avoid
# a false-positive block.
trustPolicyExclude:
  - 'semver@6.3.1'
