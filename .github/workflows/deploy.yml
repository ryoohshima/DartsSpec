# 本番デプロイ: main への push、または release.yml からの workflow_call で
# Cloudflare Workers へデプロイする。
#
# 必要な Secrets（Settings → Secrets and variables → Actions）:
#   CLOUDFLARE_API_TOKEN  … 権限は Account: Workers Scripts:Edit + D1:Edit、
#                           Zone(darts-spec.com): Workers Routes:Edit + Zone:Read が必要
#                           （zone route 方式のため Zone 権限も必須。#42 で検証済み）
#   CLOUDFLARE_ACCOUNT_ID

name: Deploy

on:
  push:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        description: デプロイ対象の ref（タグなど。省略時はトリガー時点の SHA）
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || '' }}
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: D1 マイグレーション適用（本番）
        run: pnpm exec wrangler d1 migrations apply dartsspec --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: ビルド & デプロイ
        run: pnpm run deploy
        env:
          # OGP メタタグの絶対 URL 生成に必要（src/routes/s/$id.tsx。未設定だと相対 URL になり SNS カードが壊れる）
          VITE_SITE_URL: https://darts-spec.com
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
