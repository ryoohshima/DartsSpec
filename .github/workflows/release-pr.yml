# リリース PR 作成: develop → main のリリース同期 PR を手動トリガーで作成する。
# マージすると deploy.yml が本番デプロイを実行する。
#
# 前提: リポジトリ設定で「Allow GitHub Actions to create and approve pull requests」
# （Settings → Actions → General → Workflow permissions）を有効にすること。

name: Release PR

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  create-release-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: develop → main の PR を作成
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh pr list --base main --head develop --state open --json number --jq length | grep -qv '^0$'; then
            echo "既存のリリース PR があるためスキップ"
            exit 0
          fi
          gh pr create \
            --base main \
            --head develop \
            --title "release: develop を main に同期" \
            --body "develop → main のリリース同期 PR。マージすると Cloudflare Workers へ本番デプロイされる。"
